# Builds, signs (once SignPath is set up) and publishes a GitHub release.
# Run it from the Actions tab: Release -> Run workflow (on the main branch).
# The version comes from AssemblyInformationalVersion in src/VNCFavourites.cs.
name: Release

on:
  workflow_dispatch:
    inputs:
      signing-policy:
        description: "SignPath signing policy (used only once SignPath is configured)"
        type: choice
        options: [release-signing, test-signing]
        default: release-signing
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $src = Get-Content src/VNCFavourites.cs -Raw
          $m = [regex]::Match($src, 'AssemblyInformationalVersion\("([^"]+)"\)')
          if (-not $m.Success) { throw "AssemblyInformationalVersion not found" }
          $v = $m.Groups[1].Value
          if ((git ls-remote --tags origin "refs/tags/v$v")) { throw "Tag v$v already exists - bump the version first." }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $v"

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Upload unsigned build
        id: upload-unsigned
        uses: actions/upload-artifact@v6
        with:
          name: VNCFavourites-unsigned
          path: dist/VNCFavourites.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'vnc-favourites' }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $exe = "dist/VNCFavourites.exe"
          $signed = $false
          if (Test-Path "signed/VNCFavourites.exe") {
            $exe = "signed/VNCFavourites.exe"
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne 'Valid') { throw "Signed file failed verification: $($sig.Status)" }
            $signed = $true
          }
          $stage = "release/VNCFavourites-$v"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md, CHANGELOG.md $stage
          $zip = "release/VNCFavourites-$v-win.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $lines = foreach ($f in @($zip, "$stage/VNCFavourites.exe")) {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf)
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

          # Release notes: this version's CHANGELOG section, plus signing status.
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n**Download:** VNCFavourites-$v-win.zip - unzip and run VNCFavourites.exe. Checksums are in SHA256SUMS.txt."
          if ($signed) { $notes += "`n`nThe executable is code-signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation." }
          else { $notes += "`n`nThis build is not code-signed yet, so Windows may show a SmartScreen warning (More info -> Run anyway)." }
          $notes | Set-Content release/notes.md -Encoding utf8
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $ghArgs = @("release", "create", "v$v",
                    "${{ steps.package.outputs.zip }}", "release/SHA256SUMS.txt",
                    "--title", "VNC Favourites $v",
                    "--notes-file", "release/notes.md",
                    "--target", "${{ github.sha }}")
          if ("${{ inputs.draft }}" -eq "true") { $ghArgs += "--draft" }
          gh @ghArgs
